[project]
name = "arcade-megamix"
version = "0.1.0"
description = "A pygame mashup of Snake, Asteroids, Pong, Tron and Pac-Man with rapidly switching mini-games."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.6.0",
]

[project.scripts]
arcade-megamix = "megamix.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/megamix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
