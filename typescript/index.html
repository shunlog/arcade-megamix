<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arcade Megamix</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #080810;
        overflow: hidden;
      }
      /* The page contains only the canvas; contain keeps its 4:3 ratio. */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="800" height="600"></canvas>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
