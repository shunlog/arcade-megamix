<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arcade Megamix</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* Gray frame so the 4:3 play area is clearly distinguishable from
           the page/iframe around it. */
        background: #3a3f4a;
        overflow: hidden;
      }
      /* Center the canvas and keep its exact 4:3 (800x600) game area, so the
         element itself is never wider or taller than the rendered game. */
      body {
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        width: min(100vw, calc(100vh * 4 / 3));
        height: min(100vh, calc(100vw * 3 / 4));
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="800" height="600"></canvas>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
